<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel — Barbearia do Juan</title>
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" type="image/png" href="assets/logo/logo-128.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <!-- LOGIN -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="form-login" novalidate>
      <img src="assets/logo/logo-480.png" alt="Barbearia do Juan" width="120" height="125">
      <h1>Painel administrativo</h1>
      <div class="campo"><label for="l-user">Usuário ou e-mail</label><input id="l-user" name="usuario" autocomplete="username" required></div>
      <div class="campo"><label for="l-senha">Senha</label><input id="l-senha" name="senha" type="password" autocomplete="current-password" required></div>
      <p class="erro-login" id="l-erro" role="alert" hidden></p>
      <button class="btn btn--solid" type="submit" id="l-btn">Entrar</button>
      <a class="voltar-site" href="index.html">← Voltar ao site</a>
    </form>
  </main>

  <!-- PAINEL -->
  <div class="adm" id="painel" hidden>
    <aside class="side" id="side" aria-label="Menu do painel">
      <div class="side__marca"><img src="assets/logo/logo-480.png" alt="" width="64" height="66"><span>BARBEARIA DO JUAN</span></div>
      <nav class="side__nav" id="nav">
        <a href="#/dashboard" data-v="dashboard"><i data-icon="home"></i>Dashboard</a>
        <a href="#/agendamentos" data-v="agendamentos"><i data-icon="calendar"></i>Agendamentos</a>
        <a href="#/servicos" data-v="servicos"><i data-icon="scissors"></i>Serviços</a>
        <a href="#/combos" data-v="combos"><i data-icon="layers"></i>Combos</a>
        <a href="#/horarios" data-v="horarios"><i data-icon="clock"></i>Horários</a>
        <a href="#/bloqueios" data-v="bloqueios"><i data-icon="ban"></i>Bloqueios</a>
        <a href="#/galeria" data-v="galeria"><i data-icon="image"></i>Galeria</a>
        <a href="#/config" data-v="config"><i data-icon="settings"></i>Configurações</a>
      </nav>
      <div class="side__rodape">
        <a href="index.html" target="_blank" rel="noopener"><i data-icon="eye"></i>Ver site</a>
        <button type="button" id="sair"><i data-icon="logout"></i>Sair</button>
      </div>
    </aside>
    <div class="side__veu" id="veu" hidden></div>
    <div class="principal">
      <header class="topo">
        <button type="button" class="topo__menu" id="abrir-menu" aria-label="Abrir menu" aria-controls="side"><i data-icon="menu"></i></button>
        <span class="topo__titulo" id="titulo-topo">Dashboard</span>
      </header>
      <main class="conteudo" id="conteudo" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo">
    <form method="dialog" class="modal__box" id="modal-form" novalidate>
      <header class="modal__topo"><h2 id="modal-titulo"></h2><button type="button" class="icone" id="modal-x" aria-label="Fechar"><i data-icon="close"></i></button></header>
      <div class="modal__corpo" id="modal-corpo"></div>
      <footer class="modal__rodape" id="modal-rodape"></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/services.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
